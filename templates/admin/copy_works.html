{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div class="content">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            {{ form.target_object.label_tag }}
            {{ form.target_object }}
        </div>
        
        <h2>Выбранные задачи для копирования:</h2>
        <ul>
            {% for work in works %}
            <li>{{ work.name }} ({{ work.object.name }})</li>
            <input type="hidden" name="_selected_action" value="{{ work.pk }}">
            {% endfor %}
        </ul>
        
        <input type="hidden" name="action" value="copy_works_action">
        <div class="submit-row">
            <input type="submit" name="apply" value="Подтвердить" class="default">
            <a href="." class="button cancel-link">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
