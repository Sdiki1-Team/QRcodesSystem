            proxy_set_header Host $host;
        }

        location /admin/ {
            proxy_pass http://coffee-backend:8000/admin/;
            proxy_set_header Host $host;
        }

        location /swagger/ {
            proxy_pass http://coffee-backend:8000/swagger/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://coffee-frontend:3000/;
            proxy_set_header Host $host;
        }
    }

